name: Synchro Entente Virtuafoot

on:
  schedule:
    # Vous pouvez modifier l'heure de planification selon vos préférences (ici, tous les jours à 7h00 du matin UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permet de le lancer manuellement depuis l'onglet Actions de GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Lancement du script Entente
        env:
          VF_USERNAME: ${{ secrets.VF_USERNAME }}
          VF_PASSWORD: ${{ secrets.VF_PASSWORD }}
          GOOGLE_WEBHOOK_URL: ${{ secrets.GOOGLE_WEBHOOK_URL }}
        run: |
          python entente.py
