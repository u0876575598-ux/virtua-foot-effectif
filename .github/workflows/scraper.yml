name: Virtuafoot Scraper

on:
  schedule:
    - cron: '0 6 * * *' # S'exécute chaque jour à 6h00 UTC
  workflow_dispatch: # Permet aussi de le lancer manuellement à tout moment

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run script
        env:
          VF_USERNAME: ${{ secrets.VF_USERNAME }}
          VF_PASSWORD: ${{ secrets.VF_PASSWORD }}
        run: python fetch_virtuafoot.py

      - name: Commit and push CSV update


      - name: Commit and push CSV update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add virtuafoot_effectif.csv
          git commit -m "Mise à jour automatique des stats Virtuafoot" || exit 0
          git push
